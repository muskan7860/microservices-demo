apiVersion: apps/v1
kind: Deployment
metadata:
  name: jenkins
  namespace: jenkins
  labels:
    app: jenkins

spec:
  replicas: 1

  selector:
    matchLabels:
      app: jenkins

  template:
    metadata:
      labels:
        app: jenkins

    spec:
      containers:
        - name: jenkins
          image: muskanpatel71198/custom-jenkins:v17
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8080

          resources: {}

          volumeMounts:
            - name: jenkins-home
              mountPath: /var/jenkins_home

            - name: docker-sock
              mountPath: /var/run/docker.sock

      restartPolicy: Always

      volumes:
        - name: jenkins-home
          persistentVolumeClaim:
            claimName: jenkins-pvc

        - name: docker-sock
          hostPath:
            path: /var/run/docker.sock
            type: Socket
